<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AIARC OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
/* Source for the 1200x630 social card. Render this at exactly 1200x630 and
   screenshot it to produce og.png. Same tokens as the site so the card and the
   page read as one thing. Skyline paths are kept in sync by tools/skyline.js. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:#181818;color:#eeeeee;
  font-family:'Inter','Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wordmark{
  position:absolute;top:56px;left:64px;z-index:1;
  font-size:26px;font-weight:500;letter-spacing:.055em;line-height:1;
}
.copy{
  position:absolute;top:140px;left:64px;right:64px;z-index:1;
}
h1{
  margin:0;font-family:'Libre Baskerville','Noto Serif KR',serif;font-weight:400;
  font-size:62px;line-height:1.15;letter-spacing:-.025em;word-break:keep-all;
}
h1 .line{display:block}
p{
  margin:28px 0 0;max-width:760px;
  font-size:23px;line-height:1.6;color:#a4a19b;word-break:keep-all;
}
/* Full bleed, exactly as on the page: the ground line runs corner to corner and
   the card is just a shorter viewport. The copy sits higher than the page's so the
   tower still clears the strapline at 1200px wide. */
.skyline{position:absolute;left:0;right:0;bottom:14px;width:100%}
.skyline svg{display:block;width:100%;height:auto}
/* The stroke is taken out of the viewBox scale (non-scaling-stroke on the path)
   so it can be set in real pixels here. 0.099vw is exactly the 1.9 the drawing
   is drawn at when rendered 1905px wide; the floor keeps a phone from
   rendering it at half a pixel, the ceiling keeps an ultrawide from fattening
   it into a marker line. */
#skyline-line{stroke-width:clamp(1px, 0.099vw, 2.5px)}
</style>
</head>
<body>
  <div class="wordmark">AIARC</div>

  <div class="copy">
    <h1>공사가 끝나도 <span class="line">서류는 끝나지 않습니다.</span></h1>
    <p>받은 서류는 정리하고, 빠진 자료는 요청하고, 최종 제출까지 추적합니다.</p>
  </div>
