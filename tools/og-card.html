<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AIARC OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
/* Source for the 1200x630 social card. Render this at exactly 1200x630 and
   screenshot it to produce og.png. Same tokens as the site so the card and the
   page read as one thing. Skyline paths are kept in sync by tools/skyline.js. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:#181818;color:#eeeeee;
  font-family:'Inter','Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wordmark{
  position:absolute;top:56px;left:64px;z-index:1;
  font-size:26px;font-weight:500;letter-spacing:.055em;line-height:1;
}
.copy{
  position:absolute;top:170px;left:64px;right:64px;z-index:1;
}
h1{
  margin:0;font-family:'Libre Baskerville','Noto Serif KR',serif;font-weight:400;
  font-size:62px;line-height:1.15;letter-spacing:-.025em;word-break:keep-all;
}
h1 .line{display:block}
p{
  margin:28px 0 0;max-width:760px;
  font-size:23px;line-height:1.6;color:#a4a19b;word-break:keep-all;
}
/* The svg is 1200 * 360/630 = 685.7px tall and its baseline sits at y=177 of the
   360 viewBox, i.e. 337.1px down. 276 puts that ground line at y=613, leaving room
   for the descenders that stab below it instead of cropping them at the edge. */
.skyline{position:absolute;left:0;right:0;top:276px;width:100%}
.skyline svg{display:block;width:100%;height:auto}
/* The viewBox transform scales the stroke with the viewport, so a declared 1.5
   became 4.5px at 1920 and the hairline read as a heavy outline. Pinning it to a
   flat 1.5px went too far the other way: at 1920 the drawing is 272px tall, and
   the reference's line is about 1.1% of its drawing height. 0.16vw holds that
   ratio at every width, with a cap so ultrawide screens do not thicken it again. */
#skyline-line{vector-effect:non-scaling-stroke;stroke-width:1.9px}
</style>
</head>
<body>
  <div class="wordmark">AIARC</div>

  <div class="copy">
    <h1>공사가 끝나도 <span class="line">서류는 끝나지 않습니다.</span></h1>
    <p>받은 서류는 정리하고, 빠진 자료는 요청하고, 최종 제출까지 추적합니다.</p>
  </div>

  <div class="skyline">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 360" preserveAspectRatio="none" aria-hidden="true">
      <path id="skyline-line" d="M 0,176 L 234,176 L 234.9,176.1 L 234.4,139.3 L 260.6,139 L 260.3,176.3 L 261,175.6 L 260.4,105.5 L 279.8,105.8 L 279.5,176.1 L 282.2,175.9 L 282.4,141.3 L 287.7,140.6 L 287.7,176.4 L 288.4,176.2 L 288.7,96.5 L 301.4,96.5 L 300.8,175.9 L 302.4,175.8 L 301.9,113.9 L 315.5,114.2 L 314.4,176.4 L 315.9,176.2 L 315.3,158.9 L 322.3,159 L 322.5,176.2 L 324.1,175.5 L 323.9,145.7 L 330,145.5 L 341.4,146.3 L 342,67 L 342.9,145.7 L 331.4,84.1 L 339.3,84.2 L 338.7,176 L 344.6,175.5 L 343.6,82.4 L 350.6,83.2 L 350.7,175.7 L 352,176.3 L 352.2,151.3 L 364.9,151.1 L 364.5,175.6 L 365.6,176.1 L 365.8,110 L 388.7,110.3 L 389.2,175.6 L 391.3,175.7 L 392.3,148.2 L 405.4,148 L 405.5,175.5 L 406.4,176.4 L 407.4,161.4 L 425.4,161.3 L 426.2,176.2 L 427,176 L 630,176" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    </svg>
  </div>
</body>
</html>
