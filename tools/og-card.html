<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AIARC OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Libre+Baskerville:wght@400&family=Noto+Sans+KR:wght@400&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
/* Source for the 1200x630 social card. Render this at exactly 1200x630 and
   screenshot it to produce og.png. Same tokens and the same artwork as the page,
   so the card and the site read as one thing. The graphic is kept in sync by
   tools/embed-art.js — it writes into the .hero-art-clip slot below, the same
   slot it fills in index.html, so both come from the one Illustrator master. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{--background:#181818}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:var(--background);color:rgb(255 255 255);
  font-family:'Inter','Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wordmark{
  position:absolute;top:56px;left:64px;z-index:2;
  font-size:26px;font-weight:500;letter-spacing:.055em;line-height:1;
}
.copy{
  position:absolute;top:140px;left:64px;right:64px;z-index:2;
}
h1{
  margin:0;font-family:'Libre Baskerville','Noto Serif KR',serif;font-weight:400;
  font-size:62px;line-height:1.08;letter-spacing:-.025em;word-break:keep-all;
}
h1 .line{display:block}
p{
  margin:28px 0 0;max-width:760px;
  font-size:23px;line-height:1.6;color:rgb(255 255 255 / .7);word-break:keep-all;
}

/* The artwork, sized as one box with nothing inside repositioned — but sized for
   this card rather than for the page. Full bleed does not survive here: at 1200
   wide the drawing is 675 tall on a 630 card, which puts its ink at y 200 while
   the copy runs to y 339, so the frames climb behind the headline. The card is
   1200x630 with a big copy block; something has to give, and a legible complete
   drawing beats a full-bleed one with its top hidden.
   So it is scaled to drop the whole ink band into the space under the copy:
   945 wide (k = 0.492), top 170, which puts the ink at y 363..618 — 24px below
   the strapline and 12px off the card's floor. The box runs on to y 702 and the
   card crops it, but only the artboard's empty bottom. */
.hero-art{
  position:absolute;left:0;right:0;top:170px;margin:0 auto;
  width:945px;aspect-ratio:1920 / 1080;max-width:none;
  pointer-events:none;z-index:0;
  /* third rung of the ladder, matching the page: headline 100, subhead 70, this 60 */
  opacity:.6;
}
.hero-art-clip{position:absolute;inset:0}
#hero-art-svg{display:block;width:100%;height:100%}
/* The knockouts carry the page colour so they hide the lines behind them; SVG's
   default fill is black, which would show as dark patches once the graphic is
   composited. Same rule as the page. */
#hero-art-svg #TEXTURE path:not([class]),
#hero-art-svg #TEXTURE polygon:not([class]){fill:var(--background)}
/* A still: the mask that animates on the page is simply left fully open here. */
#hero-art-svg #CLEAN polyline{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
</style>
</head>
