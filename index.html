<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIARC — 건설 서류 자동화</title>
<meta name="description" content="공사가 끝나도 서류는 끝나지 않습니다. AIARC는 현장 서류를 자동으로 정리합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- css2 requires families in alphabetical order or it 400s and nothing loads -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
/* ── tokens: measured from altitude.so, cross-checked against DESIGN (Altitude).md ── */
:root{
  --background:#181818;      /* oklch(21% 0 0)      */
  --foreground:#eeeeee;      /* oklch(95% 0 84.56)  */
  --muted-foreground:#a4a19b;/* oklch(71% .01 86.85)*/
  --muted:#262626;           /* oklch(27% 0 0)      */
  --border:#2b2b2b;          /* oklch(29% 0 0)      */
  --primary:#f8f8f8;         /* oklch(98% 0 67.8)   */
  --primary-foreground:#181818;

  --font-serif:'Libre Baskerville','Noto Serif KR',ui-serif,Georgia,serif;
  --font-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --header-h:64px;
  --container:1280px;
  --gutter:24px;

  /* Altitude's two motion curves, read off the live site */
  --ease-reveal:cubic-bezier(.23,1,.32,1); /* hero text, 600ms */
  --ease-ui:cubic-bezier(.4,0,.2,1);       /* hover/press, 150ms */
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;padding:0}

.container{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
@media (min-width:1024px){.container{padding:0 32px}}

/* ── header ───────────────────────────────────────────────────────────────── */
.site-header{
  position:fixed;inset:0 0 auto 0;z-index:100;
  background:var(--background);
  border-bottom:1px solid transparent;
}
.nav{position:relative;display:flex;height:var(--header-h);align-items:center;justify-content:space-between}

.wordmark{
  display:flex;align-items:center;
  /* 23px Inter gives ~16.7px caps, matching the 17px cap height of Altitude's logotype */
  font-size:23px;font-weight:500;letter-spacing:.055em;
  color:var(--foreground);line-height:1;
}

/* centred menu — absolutely positioned exactly as on Altitude, so it stays
   optically centred regardless of how wide the wordmark or the right slot get */
.nav-center{position:absolute;left:50%;transform:translateX(-50%);display:none}
.nav-center ul{display:flex;align-items:center;gap:0}
.nav-center a{
  display:flex;height:var(--header-h);align-items:center;padding:0 16px;
  font-size:14px;font-weight:500;color:var(--foreground);
  transition:color .15s var(--ease-ui);
}
/* Altitude's nav links resolve to hover:text-foreground on text that is already
   foreground — i.e. no hover state at all. Reproduced rather than invented. */
.nav-center a:hover{color:var(--foreground)}

.nav-right{display:none;align-items:center;gap:8px;min-width:200px;justify-content:flex-end}

.btn{
  display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;
  white-space:nowrap;border:1px solid transparent;font-weight:500;
  outline:none;cursor:pointer;transition:all .15s var(--ease-ui);
}
.btn:active{transform:scale(.97)}
.btn:focus-visible{border-color:#e4e4e4;box-shadow:0 0 0 3px rgba(228,228,228,.5)}

.btn-ghost{height:28px;padding:0 10px;border-radius:2px;font-size:12.8px;color:var(--foreground)}
.btn-ghost:hover{background:rgba(38,38,38,.5)}

.btn-primary{
  height:36px;padding:0 10px;gap:6px;border-radius:4px;
  background:var(--primary);color:var(--primary-foreground);font-size:14px;
}
.btn-primary:hover{background:rgba(248,248,248,.8)}

.menu-toggle{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;margin-right:-8px;border-radius:4px;
  color:var(--muted-foreground);cursor:pointer;
  transition:color .15s var(--ease-ui);
}
.menu-toggle:hover{color:var(--foreground)}

.mobile-menu{padding:16px 24px}
.mobile-menu[hidden]{display:none}
.mobile-menu a{display:block;padding:12px 0;font-size:14px;font-weight:500;color:var(--muted-foreground)}
.mobile-menu .btn{
  width:100%;height:32px;margin-top:16px;padding:0 10px;border-radius:4px;
  border-color:var(--border);background:rgba(88,88,88,.3);
  color:var(--foreground);font-size:14px;
}
.mobile-menu .btn:hover{background:rgba(88,88,88,.5)}

@media (min-width:768px){
  .nav-center,.nav-right{display:flex}
  .menu-toggle{display:none}
  .mobile-menu{display:none}
}

/* ── hero ─────────────────────────────────────────────────────────────────── */
main{padding-top:var(--header-h)}

.hero{
  position:relative;display:flex;flex-direction:column;align-items:center;
  min-height:100vh;max-height:100vh;padding:0 24px;overflow:hidden;
}

/* top:20% and top:30% are Altitude's own anchors — they keep the headline and the
   line graphic pinned to the same fractions of the viewport at every height */
.hero-copy{
  position:absolute;top:20%;left:50%;transform:translateX(-50%);
  width:100%;max-width:896px;padding:0 24px;text-align:center;
}

.hero h1{
  font-family:var(--font-serif);font-weight:400;
  font-size:48px;line-height:1.1;letter-spacing:-.025em;
  color:var(--foreground);
  /* Korean has no inter-syllable break opportunity worth taking — without this the
     browser splits 않습니다 across lines at narrow widths */
  word-break:keep-all;
}
.hero h1 .line{display:block}

/* 94px = Altitude's subhead block (24 + 29) plus its mt-10 (40). Removing the
   subhead per spec would raise the button; this keeps it on the same baseline.
   Below 640px Altitude's subhead wraps to two lines and its gap grows to 122px,
   so the button lands at y=514 there — matched in the media query below. */
.hero-cta{margin-top:94px;display:flex;align-items:center;justify-content:center}
@media (max-width:639px){.hero-cta{margin-top:122px}}

.skyline{position:absolute;top:30%;left:0;right:0;width:100%;pointer-events:none}
.skyline-clip{width:100%;overflow:hidden}
.skyline svg{display:block;width:100%;min-width:900px;height:auto}

/* ── motion ───────────────────────────────────────────────────────────────── */
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
@keyframes skyline-reveal{
  from{clip-path:inset(0 100% 0 0)}
  to{clip-path:inset(0 0 0 0)}
}

.reveal{
  opacity:0;transform:translateY(24px);
  animation:reveal 600ms var(--ease-reveal) forwards;
}
.reveal-1{animation-delay:0ms}
.reveal-2{animation-delay:300ms}

.skyline{
  clip-path:inset(0 100% 0 0);
  animation:skyline-reveal 2500ms ease-out 600ms forwards;
}

@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;animation:none}
  .skyline{clip-path:none;animation:none}
}

/* ── footer ───────────────────────────────────────────────────────────────── */
.site-footer{background:var(--background);border-top:1px solid rgba(43,43,43,.3)}
.footer-cols{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:48px 32px;max-width:768px;margin:0 auto;padding:64px 0;
}
.footer-cols h3{
  margin:0 0 20px;font-size:14px;letter-spacing:.025em;color:var(--muted-foreground);
}
.footer-cols li+li{margin-top:14px}
.footer-cols a{font-size:14px;color:var(--foreground);transition:color .2s var(--ease-ui)}
.footer-cols a:hover{color:rgba(238,238,238,.7)}
.footer-legal{padding:32px 0;text-align:center;font-size:12px;color:rgba(164,161,155,.7)}

@media (min-width:768px){
  .footer-cols{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1024px){
  .footer-cols{gap:48px 64px;padding:80px 0}
}

/* ── type scale: Altitude's text-5xl / sm:text-6xl / lg:text-7xl ──────────── */
@media (min-width:640px){.hero h1{font-size:60px}}
@media (min-width:1024px){.hero h1{font-size:72px}}
</style>
</head>

<script>
  var toggle = document.querySelector('.menu-toggle');
  var menu = document.getElementById('mobile-menu');
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    toggle.setAttribute('aria-label', open ? '메뉴 열기' : '메뉴 닫기');
    menu.hidden = open;
  });
</script>
