<style>
/* ── tokens: measured from altitude.so, cross-checked against DESIGN (Altitude).md ── */
:root{
  /* rgb triples so every alpha variant below derives from one source
     instead of a re-typed hex (design-system: no raw hex in components) */
  --background-rgb:24 24 24;         /* oklch(21% 0 0)       */
  --foreground-rgb:238 238 238;      /* oklch(95% 0 84.56)   */
  --muted-foreground-rgb:164 161 155;/* oklch(71% .01 86.85) */
  --muted-rgb:38 38 38;              /* oklch(27% 0 0)       */
  --border-rgb:43 43 43;             /* oklch(29% 0 0)       */
  --primary-rgb:248 248 248;         /* oklch(98% 0 67.8)    */
  --ring-rgb:228 228 228;            /* oklch(92% 0 84.56)   */
  --input-rgb:88 88 88;              /* oklch(46% 0 197.11)  */

  --background:rgb(var(--background-rgb));
  --foreground:rgb(var(--foreground-rgb));
  --muted-foreground:rgb(var(--muted-foreground-rgb));
  --muted:rgb(var(--muted-rgb));
  --border:rgb(var(--border-rgb));
  --primary:rgb(var(--primary-rgb));
  --ring:rgb(var(--ring-rgb));
  --primary-foreground:#181818;

  --font-serif:'Libre Baskerville','Noto Serif KR',ui-serif,Georgia,serif;
  --font-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --header-h:64px;
  --container:1280px;
  --gutter:24px;

  /* Altitude's two motion curves, read off the live site */
  --ease-reveal:cubic-bezier(.23,1,.32,1); /* hero text, 600ms */
  --ease-ui:cubic-bezier(.4,0,.2,1);       /* hover/press, 150ms */
}

*,*::before,*::after{box-sizing:border-box}
/* the header is fixed, so anchor jumps and keyboard focus must clear it —
   WCAG 2.2 AA 2.4.11 Focus Not Obscured */
html{-webkit-text-size-adjust:100%;scroll-padding-top:var(--header-h)}
body{
  margin:0;
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;padding:0}

.container{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
@media (min-width:1024px){.container{padding:0 32px}}

/* one shared focus ring — the reference ships none on its nav links */
:where(a,button):focus-visible{
  outline:2px solid var(--foreground);
  outline-offset:2px;
  border-radius:2px;
}

.skip-link{
  position:absolute;left:8px;top:-64px;z-index:200;
  padding:8px 12px;border-radius:4px;
  background:var(--foreground);color:var(--background);
  font-size:14px;font-weight:500;
  transition:top .15s var(--ease-ui);
}
/* :focus, not :focus-visible — a skip link must surface on any focus */
.skip-link:focus{top:8px}

/* ── header ───────────────────────────────────────────────────────────────── */
.site-header{
  position:fixed;inset:0 0 auto 0;z-index:100;
  background:var(--background);
  border-bottom:1px solid transparent;
}
.nav{position:relative;display:flex;height:var(--header-h);align-items:center;justify-content:space-between}

.wordmark{
  display:flex;align-items:center;
  /* 23px Inter gives ~16.7px caps, matching the 17px cap height of Altitude's logotype */
  font-size:23px;font-weight:500;letter-spacing:.055em;
  color:var(--foreground);line-height:1;
}

/* centred menu — absolutely positioned exactly as on Altitude, so it stays
   optically centred regardless of how wide the wordmark or the right slot get */
.nav-center{position:absolute;left:50%;transform:translateX(-50%);display:none}
.nav-center ul{display:flex;align-items:center;gap:0}
.nav-center a{
  position:relative;
  display:flex;height:var(--header-h);align-items:center;padding:0 16px;
  font-size:14px;font-weight:500;color:var(--foreground);
  transition:color .15s var(--ease-ui);
}
/* The reference's nav hover resolves to text-foreground on already-foreground
   text, so it has no hover state at all. This is the underline marker its own
   style guide describes for the active state, reused as the hover affordance. */
.nav-center a::after{
  content:"";position:absolute;left:16px;right:16px;bottom:20px;height:1px;
  background:var(--muted-foreground);
  transform:scaleX(0);transform-origin:left center;
  transition:transform .2s var(--ease-ui);
}
.nav-center a:hover::after,
.nav-center a:focus-visible::after{transform:scaleX(1)}

.nav-right{display:none;align-items:center;gap:8px;min-width:200px;justify-content:flex-end}

.btn{
  display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;
  white-space:nowrap;border:1px solid transparent;font-weight:500;
  outline:none;cursor:pointer;transition:all .15s var(--ease-ui);
}
.btn:active{transform:scale(.97)}
.btn:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px rgb(var(--ring-rgb) / .5)}

.btn-ghost{height:28px;padding:0 10px;border-radius:2px;font-size:12.8px;color:var(--foreground)}
.btn-ghost:hover{background:rgb(var(--muted-rgb) / .5)}

.btn-primary{
  height:36px;padding:0 10px;gap:6px;border-radius:4px;
  background:var(--primary);color:var(--primary-foreground);font-size:14px;
}
.btn-primary:hover{background:rgb(var(--primary-rgb) / .8)}

.menu-toggle{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;margin-right:-8px;border-radius:4px;
  color:var(--muted-foreground);cursor:pointer;
  transition:color .15s var(--ease-ui);
}
.menu-toggle:hover{color:var(--foreground)}

.mobile-menu{padding:16px 24px}
.mobile-menu[hidden]{display:none}
.mobile-menu a{display:block;padding:12px 0;font-size:14px;font-weight:500;color:var(--muted-foreground)}
.mobile-menu .btn{
  width:100%;height:32px;margin-top:16px;padding:0 10px;border-radius:4px;
  border-color:var(--border);background:rgb(var(--input-rgb) / .3);
  color:var(--foreground);font-size:14px;
}
.mobile-menu .btn:hover{background:rgb(var(--input-rgb) / .5)}

@media (min-width:768px){
  .nav-center,.nav-right{display:flex}
  .menu-toggle{display:none}
  .mobile-menu{display:none}
}

/* ── hero ─────────────────────────────────────────────────────────────────── */
main{padding-top:var(--header-h)}

/* svh, not vh: on iOS Safari 100vh is the URL-bar-hidden height, so the hero
   starts taller than the visible area and pushes the CTA below the fold on
   first paint. vh lines first as the fallback for browsers without svh. */
.hero{
  position:relative;display:flex;flex-direction:column;align-items:center;
  min-height:100vh;max-height:100vh;
  min-height:100svh;max-height:100svh;
  padding:0 24px;overflow:hidden;
}

/* top:20% and top:30% are Altitude's own anchors — they keep the headline and the
   line graphic pinned to the same fractions of the viewport at every height */
.hero-copy{
  position:absolute;top:20%;left:50%;transform:translateX(-50%);
  width:100%;max-width:896px;padding:0 24px;text-align:center;
}

.hero h1{
  font-family:var(--font-serif);font-weight:400;
  font-size:48px;line-height:1.1;letter-spacing:-.025em;
  color:var(--foreground);
  /* Korean has no inter-syllable break opportunity worth taking — without this the
     browser splits 않습니다 across lines at narrow widths */
  word-break:keep-all;
}
.hero h1 .line{display:block}

/* 94px = Altitude's subhead block (24 + 29) plus its mt-10 (40). Removing the
   subhead per spec would raise the button; this keeps it on the same baseline.
   Below 640px Altitude's subhead wraps to two lines and its gap grows to 122px,
   so the button lands at y=514 there — matched in the media query below. */
.hero-cta{margin-top:94px;display:flex;align-items:center;justify-content:center}
@media (max-width:639px){.hero-cta{margin-top:122px}}

.skyline{position:absolute;top:30%;left:0;right:0;width:100%;pointer-events:none}
.skyline-clip{width:100%;overflow:hidden}
.skyline svg{display:block;width:100%;min-width:900px;height:auto}

/* ── motion ───────────────────────────────────────────────────────────────── */
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
@keyframes skyline-reveal{
  from{clip-path:inset(0 100% 0 0)}
  to{clip-path:inset(0 0 0 0)}
}

.reveal{
  opacity:0;transform:translateY(24px);
  animation:reveal 600ms var(--ease-reveal) forwards;
}
.reveal-1{animation-delay:0ms}
.reveal-2{animation-delay:300ms}

.skyline{
  clip-path:inset(0 100% 0 0);
  animation:skyline-reveal 2500ms ease-out 600ms forwards;
}

/* Scroll entry. The hidden state is scoped to .js-reveal, which the script adds
   only when motion is wanted — so with JS off or reduced motion on, the content
   is simply visible rather than stuck at opacity 0. 16px, not the hero's 24px:
   this is secondary content and should read as a fade, not a slide. */
.js-reveal .reveal-on-scroll{opacity:0;transform:translateY(16px)}
.js-reveal .reveal-on-scroll.is-in{
  opacity:1;transform:none;
  transition:opacity 600ms var(--ease-reveal),transform 600ms var(--ease-reveal);
}

@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;animation:none}
  .skyline{clip-path:none;animation:none}
  .js-reveal .reveal-on-scroll{opacity:1;transform:none}
  .nav-center a::after{transition:none}
}

/* ── footer ───────────────────────────────────────────────────────────────── */
.site-footer{background:var(--background);border-top:1px solid rgb(var(--border-rgb) / .3)}
.footer-cols{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:48px 32px;max-width:768px;margin:0 auto;padding:64px 0;
}
.footer-cols h3{
  margin:0 0 20px;font-size:14px;letter-spacing:.025em;color:var(--muted-foreground);
}
.footer-cols li+li{margin-top:14px}
.footer-cols a{font-size:14px;color:var(--foreground);transition:color .2s var(--ease-ui)}
.footer-cols a:hover{color:rgb(var(--foreground-rgb) / .7)}
/* .8 not the reference's .7: at 12px, .7 measures 4.03:1 on this canvas and
   fails WCAG AA. .8 gives 4.88:1 and is visually indistinguishable. */
.footer-legal{padding:32px 0;text-align:center;font-size:12px;color:rgb(var(--muted-foreground-rgb) / .8)}

@media (min-width:768px){
  .footer-cols{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1024px){
  .footer-cols{gap:48px 64px;padding:80px 0}
}

/* ── type scale: Altitude's text-5xl / sm:text-6xl / lg:text-7xl ──────────── */
@media (min-width:640px){.hero h1{font-size:60px}}
@media (min-width:1024px){.hero h1{font-size:72px}}
</style>
</head>

<script>
  var toggle = document.querySelector('.menu-toggle');
  var menu = document.getElementById('mobile-menu');
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    toggle.setAttribute('aria-label', open ? '메뉴 열기' : '메뉴 닫기');
    menu.hidden = open;
  });

  // Scroll entry for the footer. Opt-in: the hidden state only exists once this
  // class is set, so no-JS and reduced-motion visitors get the content outright.
  var wantsMotion = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.reveal-on-scroll');
  if (wantsMotion && 'IntersectionObserver' in window && items.length) {
    document.documentElement.classList.add('js-reveal');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-in');
        io.unobserve(entry.target);
      });
    }, { threshold: 0, rootMargin: '0px 0px -40px 0px' });
    items.forEach(function (el, i) {
      el.style.transitionDelay = i * 80 + 'ms';
      io.observe(el);
    });
  }
</script>
